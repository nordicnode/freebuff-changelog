name: eval-golden-set

# An offline audit, not historical regeneration or a fresh semantic verdict.
on:
  schedule:
    - cron: '37 4 * * 2'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: eval-golden-set
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit stored golden artifacts (zero provider calls)
        env:
          CHANGELOG_LLM: '0'
          CHANGELOG_LLM_NO_BACKFILL: '1'
        run: node generator/cli.mjs eval
      - name: Preserve report and partial checkpoints even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-audit-${{ github.run_id }}
          path: data/eval/results/*.json
          if-no-files-found: error
