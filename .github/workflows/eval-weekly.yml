name: eval-golden-set

# Weekly golden-set evaluation, committed. The eval harness (generator/cli.mjs
# eval -> lib/eval.mjs) scores the current prompt against data/eval/golden.json
# and writes data/eval/results/, but it had only ever been run by hand -- so
# the results directory stayed empty for months and every prompt-quality claim
# on /stats/ was unaudited. This workflow makes the harness speak on a schedule:
# one bounded run of ~40 rows (+judge) a week, results committed, the /stats/
# GOLDEN-SET EVAL card picks them up on the next deploy.
#
# Cost: ~40 summarizations + ~40 judge calls per week, on the same gateway and
# models as the daily pipeline. Tuesday 04:37 UTC deliberately misses the
# Monday history-compaction window.

on:
  schedule:
    - cron: '37 4 * * 2'
  workflow_dispatch:
    inputs:
      judge:
        description: 'Run the LLM judge pass (40 extra calls)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: eval-golden-set
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow is fine: eval reads data/*.json and clones *upstream* for
          # the golden rows' diffs; it never walks this repository's history.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache freebuff repository
        uses: actions/cache@v4
        with:
          # Same key as changelog-sync.yml: it is the same clone, and a warm
          # cache here costs nothing extra.
          path: .cache/freebuff
          key: freebuff-git-${{ runner.os }}-v1

      - name: Configure git bot identity
        run: |
          git config --global user.name "changelog-bot"
          git config --global user.email "changelog-bot@users.noreply.github.com"

      - name: Run golden-set eval
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGELOG_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          CHANGELOG_LLM: ${{ vars.CHANGELOG_LLM || '1' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE || vars.LLM_API_BASE }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || vars.LLM_MODEL }}
          LLM_MODEL_MAJOR: ${{ secrets.LLM_MODEL_MAJOR || vars.LLM_MODEL_MAJOR }}
          LLM_VERIFY_MODEL: ${{ secrets.LLM_VERIFY_MODEL || vars.LLM_VERIFY_MODEL }}
          LLM_JUDGE_MODEL: ${{ secrets.LLM_JUDGE_MODEL || vars.LLM_JUDGE_MODEL }}
        run: |
          if [ "${{ inputs.judge }}" = "false" ]; then
            node generator/cli.mjs eval --no-judge
          else
            node generator/cli.mjs eval
          fi

      - name: Commit and push results
        env:
          PUSH_TOKEN: ${{ secrets.CHANGELOG_GITHUB_TOKEN || github.token }}
        run: |
          if [ -z "$(git status --porcelain data/eval/results)" ]; then
            echo "eval wrote no new result file; nothing to commit."
            exit 0
          fi
          git add data/eval/results
          # [skip ci]: eval results only feed the /stats/ card; next deploy
          # picks them up. One eval a week does not need its own build.
          git commit -m "data: weekly golden-set eval ($(date -u '+%Y-%m-%d %H:%M') UTC) [skip ci]"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          # The only run this workflow ever attempted died here: the sync
          # relay pushes every few minutes, a 14-minute eval run loses that
          # race, and a bare `git push` rejected with "fetch first" -- throwing
          # away the whole week's result. Rebase onto the relay's tip and
          # retry instead; data/eval/results is written by nothing else, so
          # the rebase has no content conflict to hit.
          for i in 1 2 3 4 5; do
            # A failed rebase leaves the repo mid-rebase, which would fail
            # every later attempt before it even fetched.
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              echo "eval results pushed on attempt $i"
              exit 0
            fi
            echo "push rejected (sync relay pushed first); attempt $i/5"
            sleep $((i * 15))
          done
          echo "failed to push eval results after 5 attempts"
          exit 1
