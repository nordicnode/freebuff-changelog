name: history-size-audit

# Human code history is not disposable derived data. No orphan branches,
# force pushes, workflow disabling or automatic compaction are permitted.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report repository size without changing history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          size=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .size)
          echo "Repository size: ${size} KiB. History compaction is disabled."
          echo "Any future migration requires a reviewed archive and explicit remote-SHA lease."
