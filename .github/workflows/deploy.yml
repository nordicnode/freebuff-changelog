name: deploy-site

# Zero-build-minutes deploys. Cloudflare Workers Builds bills every git push
# (and this repo pushes data every few minutes), so Cloudflare-side builds
# stay OFF for this worker. Instead this workflow builds dist/ on GitHub
# Actions (free for this public repo) and uploads the finished output with
# `wrangler deploy`, which is a direct asset upload and consumes no
# Workers Builds minutes. wrangler.json intentionally has no build.command, so
# the site is built exactly once -- here -- and the upload does not rebuild it.
#
# Required setup (one time):
#   1. Cloudflare dashboard -> Workers & Pages -> freebuff-changelog ->
#      Settings -> Builds -> disconnect git / disable automatic builds.
#   2. Repo Settings -> Secrets and variables -> Actions:
#      - secret  CLOUDFLARE_API_TOKEN   (token with Workers Scripts: Edit,
#        scoped to this account; used only for the upload)
#      - variable CLOUDFLARE_ACCOUNT_ID (account ID from the dashboard URL)
# Without the token the build step still runs as a smoke check but the
# upload is skipped, so pushes never fail for a missing secret.
on:
  push:
    branches: [main, master]
    paths: ['data/**', 'generator/**', 'scripts/**', 'wrangler.json', 'package.json']
  # Note: a push made with the default GITHUB_TOKEN does not start workflow runs,
  # so this trigger only fires for data commits because changelog-sync.yml pushes
  # with CHANGELOG_GITHUB_TOKEN (see the auth step there). Do NOT also trigger
  # this workflow with `workflow_run`: a completed sync would then start a second
  # deploy-site run on every cycle, doubling the queue behind a build that only
  # ever uploads the same data.
  schedule:
    # Safety net: a steady deploy cadence even if path filtering ever skips.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  # Only to read changelog-sync's state for the freshness gate below: a paused
  # relay is a planned pause, not an outage.
  actions: read

concurrency:
  group: deploy-site
  # Queue, never cancel. During upstream bursts the relay pushes faster than a
  # deploy runs, and cancel-in-progress let each new push kill the in-flight
  # upload -- cancelled runs never go red, so a long burst could starve the
  # deployed site past the 10m freshness budget in an all-green Actions UI.
  # The pending run always carries newer data, so running it after the current
  # one finishes only costs a couple of minutes of latency; the queue itself
  # stays bounded to ~1 by GitHub's single-pending-per-ref rule plus this
  # workflow's own 15-minute job timeout.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow on purpose: `cli.mjs build` reads only data/*.json, never
          # git history. With ~15 MiB/day of history churn in this repo, a full
          # clone would make every one of the ~200 daily deploys slower than
          # the last; depth 1 pins checkout cost to the current tree only.
          # (History size itself is bounded by history-compaction.yml.)
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check + build
        id: build
        run: |
          for f in worker.js generator/cli.mjs generator/lib/*.mjs; do node --check "$f"; done
          node generator/cli.mjs build

      - name: Deploy prebuilt dist via wrangler (direct upload, no Cloudflare build)
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.135.0 deploy

      - name: Upload skipped (no API token configured)
        if: env.CLOUDFLARE_API_TOKEN == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "CLOUDFLARE_API_TOKEN not set; dist/ built OK but not uploaded."

      # After the upload, and on `if: always()` so the freshness verdict is
      # recorded even when an earlier step failed: this gate must never be the
      # reason a good deploy is withheld -- publishing fresh data is the whole
      # point. What it does guarantee is that this workflow can no longer go
      # green over data too old to be called fresh. It used to: changelog-sync
      # can stall silently (a relay cycle once spent its full 12 minutes
      # erroring on a lock directory it could not create, pushing nothing), and
      # every deploy of the frozen data was green, so the only witness was the
      # "[stale Nm]" badge readers see. Same threshold as that badge, asserted
      # here so CI fails first.
      - name: Detect a planned relay pause
        id: relay
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # history-compaction.yml disables changelog-sync and drains it for up
          # to ~24 minutes before force-pushing, so a stale `generatedAt` in that
          # window is a deliberate pause, not a broken loop. Exempt exactly that
          # case and nothing else: a *disabled* workflow is the one state no
          # accidental stall can produce.
          state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/changelog-sync.yml" --jq .state 2>/dev/null || echo unknown)"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" = "disabled_manually" ]; then
            echo "::warning::changelog-sync is disabled (planned pause: history compaction drains the relay): skipping the freshness gate this run"
          fi

      - name: Freshness gate (fail if the deployed data is stale)
        if: always() && steps.build.outcome == 'success' && steps.relay.outputs.state != 'disabled_manually'
        run: node generator/cli.mjs freshness
