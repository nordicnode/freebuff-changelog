name: deploy-site

# Zero-build-minutes deploys. Cloudflare Workers Builds bills every git push
# (and this repo pushes data every few minutes), so Cloudflare-side builds
# stay OFF for this worker. Instead this workflow builds dist/ on GitHub
# Actions (free for this public repo) and uploads the finished output with
# `wrangler deploy`, which is a direct asset upload and consumes no
# Workers Builds minutes. wrangler.json intentionally has no build.command, so
# the site is built exactly once -- here -- and the upload does not rebuild it.
#
# Required setup (one time):
#   1. Cloudflare dashboard -> Workers & Pages -> freebuff-changelog ->
#      Settings -> Builds -> disconnect git / disable automatic builds.
#   2. Repo Settings -> Secrets and variables -> Actions:
#      - secret  CLOUDFLARE_API_TOKEN   (token with Workers Scripts: Edit,
#        scoped to this account; used only for the upload)
#      - variable CLOUDFLARE_ACCOUNT_ID (account ID from the dashboard URL)
# Without the token the build step still runs as a smoke check but the
# upload is skipped, so pushes never fail for a missing secret.
on:
  push:
    branches: [main, master]
    paths: ['data/**', 'generator/**', 'scripts/**', 'wrangler.json', 'package.json', 'worker.js']
  # Note: a push made with the default GITHUB_TOKEN does not start workflow runs,
  # so this trigger only fires for data commits because changelog-sync.yml pushes
  # with CHANGELOG_GITHUB_TOKEN (see the auth step there). Do NOT also trigger
  # this workflow with `workflow_run`: a completed sync would then start a second
  # deploy-site run on every cycle, doubling the queue behind a build that only
  # ever uploads the same data.
  schedule:
    # Safety net: a steady deploy cadence even if path filtering ever skips.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      rebind_ask_key:
        description: 'Re-put LLM_API_KEY even if already bound (run this after rotating the key)'
        type: boolean
        default: false

permissions:
  contents: read
  # Read-only workflow diagnostics; disabling ingestion never exempts freshness.
  actions: read

concurrency:
  group: deploy-site
  # Queue, never cancel. During upstream bursts the relay pushes faster than a
  # deploy runs, and cancel-in-progress let each new push kill the in-flight
  # upload -- cancelled runs never go red, so a long burst could starve the
  # deployed site past the 10m freshness budget in an all-green Actions UI.
  # The pending run always carries newer data, so running it after the current
  # one finishes only costs a couple of minutes of latency; the queue itself
  # stays bounded to ~1 by GitHub's single-pending-per-ref rule plus this
  # workflow's own 15-minute job timeout.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow on purpose: `cli.mjs build` reads only the current tree's
          # data/ (JSON plus the changelog day shards), never git history. With
          # ~15 MiB/day of history churn in this repo, a full
          # clone would make every one of the ~200 daily deploys slower than
          # the last; depth 1 pins checkout cost to the current tree only.
          # History compaction is disabled; code history remains auditable.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check + build
        id: build
        run: |
          for f in worker.js generator/cli.mjs generator/lib/*.mjs; do node --check "$f"; done
          node generator/cli.mjs build

      - name: Deploy envelope (dist/ against the Workers static-asset cap)
        # On the artifact that is about to be uploaded, and deliberately before
        # the upload: retention is what keeps dist/ inside Cloudflare's 20,000
        # assets-per-version limit, so a regression belongs here as a failed gate
        # with a readable message, not as an upload error minutes into a deploy
        # that also has to be diagnosed through the API.
        run: node generator/cli.mjs check-dist

      - name: Deploy prebuilt dist via wrangler (direct upload, no Cloudflare build)
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.135.0 deploy

      # The Ask-the-AI key lives here, as the repo secret ASK_LLM_API_KEY --
      # deliberately separate from the relay's LLM_API_KEY, because the widget
      # calls a different provider (vyceai) than the generation pass (Agnes),
      # and neither may be steered by changing the other. Never in this
      # repository or in dashboard-managed text vars. A plain-text var set in
      # the dashboard does not survive an upload: wrangler rewrites the
      # binding set from wrangler.json, which declares no vars, so the key
      # vanished on every deploy until /api/ask reported configured:false and
      # the control disabled itself. Secrets are the documented exception --
      # they are not in the config, so nothing rewrites them -- and binding it
      # from this repo secret makes the binding self-healing: whatever a deploy
      # does, the same run puts it back. Re-puts only when it is actually
      # missing, because each put publishes a new Worker version and this
      # workflow runs ~200 times a day. The probe at the end is what turns a
      # silently disabled feature into a visible failure.
      - name: Keep the Ask-the-AI key bound (self-healing)
        id: askkey
        if: env.CLOUDFLARE_API_TOKEN != '' && steps.deploy.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          LLM_API_KEY: ${{ secrets.ASK_LLM_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://freebuff-changelog.nordicnode.workers.dev' }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::warning::ASK_LLM_API_KEY is not set as a repo secret; Ask-the-AI stays disabled on purpose"
            exit 0
          fi
          FORCE="${{ inputs.rebind_ask_key }}"
          if [ "$FORCE" = 'true' ]; then
            echo "rebind_ask_key requested (a rotation): re-putting LLM_API_KEY regardless of its state."
            printf '%s' "$LLM_API_KEY" | npx -y wrangler@4.135.0 secret put LLM_API_KEY
          elif npx -y wrangler@4.135.0 secret list 2>/dev/null | grep -q 'LLM_API_KEY'; then
            echo "LLM_API_KEY already bound as a Worker secret; leaving the deployed version alone."
          else
            echo "LLM_API_KEY missing from the worker (a dashboard text var does not survive an upload); re-binding."
            printf '%s' "$LLM_API_KEY" | npx -y wrangler@4.135.0 secret put LLM_API_KEY
          fi
          # The binding is only real when readers reach a configured worker:
          # assets and versions take a few seconds to propagate, so probe with
          # the same bounded-retry shape as the head verification below.
          for i in 1 2 3 4 5 6; do
            body="$(curl -fsS --max-time 15 "$SITE_URL/api/ask" || true)"
            case "$body" in
              *'"configured":true'*)
                echo "Ask-the-AI is configured on the deployed worker: $body"
                exit 0
                ;;
            esac
            sleep 10
          done
          echo "::error::/api/ask still reports configured:false after the deploy; Ask-the-AI is dead until LLM_API_KEY is bound"
          exit 1

      - name: Upload skipped (no API token configured)
        if: env.CLOUDFLARE_API_TOKEN == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "CLOUDFLARE_API_TOKEN not set; dist/ built OK but not uploaded."

      # After the upload, and on `if: always()` so the freshness verdict is
      # recorded even when an earlier step failed: this gate must never be the
      # reason a good deploy is withheld -- publishing fresh data is the whole
      # point. What it does guarantee is that this workflow can no longer go
      # green over data too old to be called fresh. It used to: changelog-sync
      # can stall silently (a relay cycle once spent its full 12 minutes
      # erroring on a lock directory it could not create, pushing nothing), and
      # every deploy of the frozen data was green, so the only witness was the
      # "[stale Nm]" badge readers see. Same threshold as that badge, asserted
      # here so CI fails first.
      - name: Diagnose relay state
        id: relay
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A disabled relay is diagnostic only, never a freshness exemption.
          state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/changelog-sync.yml" --jq .state 2>/dev/null || echo unknown)"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" = "disabled_manually" ]; then
            echo "::warning::changelog-sync is disabled: freshness checks remain enforced; disabled does not mean healthy"
          fi

      - name: Freshness gate (fail if the deployed data is stale)
        if: always() && steps.build.outcome == 'success'
        run: node generator/cli.mjs freshness

      # A stale-data verdict is only actionable if it says why nothing fresh was
      # published. This runs only after a failure, and names what the relay last
      # did: a changelog-sync run that concluded `cancelled` with zero steps was
      # never executed by a runner at all (queueing, or an Actions incident), so
      # no data could have been produced and nothing in this repository is at
      # fault. That is a different situation from a relay that ran, spent its
      # cycle, and failed its own gate -- without this, both look like the same
      # red run, and the platform one gets debugged as if it were ours.
      - name: Explain the failure (what the relay last did)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Last changelog-sync runs"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow changelog-sync.yml --limit 5 \
            --json databaseId,status,conclusion,createdAt,headSha \
            --jq '.[] | "\(.createdAt)  run \(.databaseId)  \(.status)/\(.conclusion)  \(.headSha[0:8])"' || true
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow changelog-sync.yml --limit 3 --json databaseId --jq '.[].databaseId'); do
            steps="$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json jobs --jq '[.jobs[].steps[]?] | length' 2>/dev/null || echo '?')"
            if [ "$steps" = "0" ]; then
              echo "::warning::changelog-sync run $id concluded without running a single step: the relay never executed, so it could not publish. That is a platform condition (Actions queueing or incident), not a relay or data fault."
            fi
          done
          echo "::endgroup::"

      - name: Verify uploaded head and upstream lag
        if: steps.build.outcome == 'success' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL || 'https://freebuff-changelog.nordicnode.workers.dev' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export UPSTREAM_HEAD="$(gh api repos/CodebuffAI/freebuff/commits/main --jq .sha)"
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          import { checkDeployedHead } from './generator/lib/sync.mjs'
          const doc = JSON.parse(await readFile('data/changelog.json', 'utf8'))
          let served, failure
          // Assets may take a few seconds to propagate. A bounded probe reads
          // what readers receive; local timestamps alone prove no deployment.
          for (let attempt = 0; attempt < 6; attempt++) {
            try {
              served = await checkDeployedHead(process.env.SITE_URL, doc.headSha, { minGeneratedAt: doc.generatedAt })
              break
            } catch (err) {
              failure = err
              if (attempt < 5) await new Promise(r => setTimeout(r, 10000))
            }
          }
          if (!served) throw failure
          if (doc.headSha !== process.env.UPSTREAM_HEAD) console.warn('::warning::Upstream advanced after checkout; awaiting ingestion.')
          console.log(`Served head verified: ${served.headSha.slice(0, 12)}; age ${Math.round(served.ageMs / 1000)}s`)
          NODE

      # Advisory, on purpose, and the one deliberate asymmetry in this file.
      #
      # The hard verdict on overdue admitted text belongs to the workflow that
      # owns generation: changelog-sync runs the model passes, names the rows and
      # dispatches the cycle that heals them, so that is where a missing
      # explanation turns a run red. This workflow can do none of those things --
      # the upload it just made is correct whether or not one admitted row is
      # still waiting for its plain-English line -- so a red run here would
      # report a failed deploy that did not fail, on every data push (~200/day),
      # for a backlog this workflow cannot touch. That is not a stricter check;
      # it is an alarm no one can act on, which is how a real deploy failure gets
      # skimmed past. The numbers and the row list are still printed here, and
      # still warn in the run summary, so the deploy job cannot go quiet about
      # them. A stalled relay is caught here by the freshness gate above, not by
      # this one.
      - name: Generation completeness report (advisory; the relay holds the gate)
        if: always() && steps.build.outcome == 'success'
        run: node generator/cli.mjs generation-health --report
