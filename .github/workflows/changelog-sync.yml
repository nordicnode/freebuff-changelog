name: changelog-sync
# Backstop for the sync. The long-running local daemon (systemd
# freebuff-backfill.service) is the primary sync owner and advances
# headSha/generatedAt itself; this schedule only covers the case where that box
# is down. Scheduled runs drift badly in practice (observed: 00:33, 05:35,
# 11:21 for an `0 * * * *` cron), so nothing may depend on it for freshness.
# Cloudflare Workers (git-integrated) rebuilds on the push; a no-op build is
# skipped because the commit step makes no commit when data/ is unchanged.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main, master]
    paths: ['generator/**']

permissions:
  contents: write

concurrency:
  group: changelog-sync
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check + tests
        run: |
          for f in generator/cli.mjs generator/lib/*.mjs; do node --check "$f"; done
          node --test "generator/test/*.test.mjs"

      - name: Cache freebuff repository
        uses: actions/cache@v4
        with:
          path: .cache/freebuff
          key: freebuff-git-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            freebuff-git-${{ runner.os }}-

      - name: Analyze upstream freebuff
        env:
          # The built-in token is scoped to THIS repo, so it cannot read
          # CodebuffAI/freebuff's pull requests -- /in-flight/ would fall back to
          # the 60-calls/hour anonymous ceiling and show a truncated list. Set a
          # repo secret (any name, CHANGELOG_GITHUB_TOKEN is what this looks for)
          # with read access to upstream; unset is fine, just slower.
          GITHUB_TOKEN: ${{ secrets.CHANGELOG_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL || 'https://freebuff-changelog.nordicnode.workers.dev' }}
          CHANGELOG_LLM: ${{ vars.CHANGELOG_LLM || '1' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE || vars.LLM_API_BASE }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || vars.LLM_MODEL }}
          CHANGELOG_LLM_LIMIT: ${{ vars.CHANGELOG_LLM_LIMIT || '10' }}
          CHANGELOG_LLM_CONCURRENCY: ${{ vars.CHANGELOG_LLM_CONCURRENCY || '2' }}
          CHANGELOG_LLM_RPM: ${{ vars.CHANGELOG_LLM_RPM || '60' }}
        run: node generator/cli.mjs generate

      - name: Commit & push data (only if changed)
        # Same code path the daemon uses: it merges into origin's data instead
        # of overwriting it, so a concurrent daemon push can never be reverted
        # and a conflicted rebase can never strand this run's commit.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "changelog-bot"
          git config user.email "changelog-bot@users.noreply.github.com"
          node generator/cli.mjs push-data --message "data: update changelog ($(date -u '+%Y-%m-%d %H:%M') UTC)"

      - name: Mid-cycle wait (2.5 minutes)
        if: github.event_name == 'schedule'
        run: sleep 150

      - name: Analyze upstream freebuff (pass 2)
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGELOG_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL || 'https://freebuff-changelog.nordicnode.workers.dev' }}
          CHANGELOG_LLM: ${{ vars.CHANGELOG_LLM || '1' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE || vars.LLM_API_BASE }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || vars.LLM_MODEL }}
          CHANGELOG_LLM_LIMIT: ${{ vars.CHANGELOG_LLM_LIMIT || '10' }}
          CHANGELOG_LLM_CONCURRENCY: ${{ vars.CHANGELOG_LLM_CONCURRENCY || '2' }}
          CHANGELOG_LLM_RPM: ${{ vars.CHANGELOG_LLM_RPM || '60' }}
        run: node generator/cli.mjs generate

      - name: Commit & push data (pass 2, only if changed)
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node generator/cli.mjs push-data --message "data: update changelog ($(date -u '+%Y-%m-%d %H:%M') UTC)"
