name: changelog-sync

# 24/7 continuous relay synchronization pipeline.
# Runs continuously via self-perpetuating workflow relay, polling upstream every 30s
# to ensure the site is updated within 30-60s of upstream changes and never exceeds 10m freshness.
# A backup schedule (every 10 minutes) serves as an automated watchdog / safety net.
on:
  schedule:
    # Watchdog schedule: restarts the relay chain if a runner is ever terminated or network drops
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main, master]
    paths: ['generator/**', '.github/workflows/**']

permissions:
  contents: write
  actions: write

concurrency:
  group: changelog-sync
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check + tests
        run: |
          for f in generator/cli.mjs generator/lib/*.mjs; do node --check "$f"; done
          node --test "generator/test/*.test.mjs"

      - name: Cache freebuff repository
        uses: actions/cache@v4
        with:
          path: .cache/freebuff
          key: freebuff-git-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            freebuff-git-${{ runner.os }}-

      - name: Configure git bot identity
        run: |
          git config --global user.name "changelog-bot"
          git config --global user.email "changelog-bot@users.noreply.github.com"

      # deploy.yml is supposed to run on every push to data/**. GitHub refuses to
      # start a workflow run for a push made with the repository's default
      # GITHUB_TOKEN -- the token actions/checkout persists as an http extraheader
      # and the sync job has been pushing with -- so deploy.yml's push trigger was
      # dead and the site refreshed only on its own 30-minute schedule. That is
      # why it read "[stale 16m]" while data commits kept landing every few minutes.
      # Authenticate the pushes with CHANGELOG_GITHUB_TOKEN instead, but only
      # after proving that token may write, so a token without Contents: write
      # falls back to the checkout credentials instead of breaking the sync.
      - name: Authenticate data pushes so they trigger deploy.yml
        env:
          PUSH_TOKEN: ${{ secrets.CHANGELOG_GITHUB_TOKEN }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::warning::CHANGELOG_GITHUB_TOKEN is not set: data pushes keep using the default GITHUB_TOKEN, which cannot trigger deploy.yml. The site will refresh only on deploy.yml's schedule."
            exit 0
          fi
          can_push="$(GH_TOKEN="$PUSH_TOKEN" gh api "repos/${GITHUB_REPOSITORY}" --jq '.permissions.push' 2>/dev/null || echo false)"
          if [ "$can_push" != "true" ]; then
            echo "::warning::CHANGELOG_GITHUB_TOKEN cannot push to ${GITHUB_REPOSITORY}: keeping the checkout credentials. The site will refresh only on deploy.yml's schedule."
            exit 0
          fi
          # checkout stores the default token under this exact key, and its
          # Authorization header takes precedence over credentials in the remote
          # URL, so replace it rather than setting URL credentials.
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          echo "Data pushes now authenticate with CHANGELOG_GITHUB_TOKEN: each data commit starts a deploy."

      - name: Run continuous sync & backfill
        id: sync_loop
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGELOG_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.CHANGELOG_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL || 'https://freebuff-changelog.nordicnode.workers.dev' }}
          CHANGELOG_LLM: ${{ vars.CHANGELOG_LLM || '1' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE || vars.LLM_API_BASE }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || vars.LLM_MODEL }}
          CHANGELOG_LLM_LIMIT: ${{ vars.CHANGELOG_LLM_LIMIT || '10' }}
          CHANGELOG_LLM_CONCURRENCY: ${{ vars.CHANGELOG_LLM_CONCURRENCY || '2' }}
          CHANGELOG_LLM_RPM: ${{ vars.CHANGELOG_LLM_RPM || '60' }}
          CHANGELOG_SYNC_STALE_MIN: '5'
          CHANGELOG_PR_REFRESH_MIN: '2'
          WATCH_INTERVAL: '30'
          WATCH_DURATION: '12m'
          WATCH_EXIT_ON_QUEUED: '1'
        run: node generator/cli.mjs watch --push --interval 30 --duration 12m --exit-on-queued

      - name: Dispatch next relay cycle
        if: always() && (steps.sync_loop.outcome == 'success' || steps.sync_loop.outcome == 'skipped')
        env:
          GH_TOKEN: ${{ secrets.CHANGELOG_GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "CHANGELOG_GITHUB_TOKEN not configured; relying on watchdog schedule."
            exit 0
          fi
          QUEUED_COUNT=$(gh run list --workflow changelog-sync.yml --json databaseId,status --jq '[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting")] | length' 2>/dev/null || echo "0")
          if [ "$QUEUED_COUNT" -eq 0 ]; then
            echo "Dispatching next relay run to maintain 24/7 continuous synchronization..."
            # A dispatch failure must not kill the chain: the next relay run
            # would simply never start, downgrading the site to watchdog-cadence
            # refreshes (10 min) without anyone noticing. Warn loudly instead.
            gh workflow run changelog-sync.yml || echo "::warning::relay dispatch failed: the watchdog schedule restarts the chain within ~10 min"
          else
            echo "A workflow run is already queued ($QUEUED_COUNT pending). Skipping duplicate dispatch."
          fi

