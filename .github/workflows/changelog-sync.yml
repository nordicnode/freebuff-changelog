name: changelog-sync

# Continuous deterministic ingestion with bounded, forward-only enrichment.
# 30s polling and a 10-minute watchdog are targets, not a delivery guarantee.
# Full regressions promote runtime revisions separately; failed code cannot
# replace the last known-good generator. Deployment probes the uploaded head.
on:
  schedule:
    # Watchdog schedule: restarts the relay chain if a runner is ever terminated or network drops
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      retry:
        description: 'Comma-separated SHA prefixes to force-regenerate (rows with no generation; bounded to 5)'
        required: false
        default: ''
      admit:
        description: 'Also release a named row that has neither admission nor a recorded ask (--admit): a deliberate admission decision, still refusing noise and rows that already have text'
        required: false
        default: 'false'
      regen:
        description: 'Regenerate the newest N entries (max 50), or a comma-separated list of SHA prefixes for named stragglers: fresh summaries for rows that already have one, first asks for rows that have none'
        required: false
        default: ''
  push:
    branches: [main, master]
    paths: ['generator/**', '.github/workflows/**']

permissions:
  contents: write
  actions: write

concurrency:
  group: changelog-sync
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    # The relay normally finishes in ~20 (setup + 12m sync loop), but a
    # dispatched regen of up to 50 rows gets a minute per row on top: 25 killed
    # the job mid-regen, before the step could publish anything it had written.
    timeout-minutes: 60
    env:
      # Every paid process (retry, regen, watch) gets the same hard-capped RPM
      # configuration. A quiet startup minute bridges process/runner handoffs.
      # This workflow is serialized; no other workflow uses the relay key.
      # Agnes AI's account ceiling is 60 requests/minute, shared by every paid stage
      # in this workflow (preserved from the previous provider until Agnes AI
      # publishes otherwise -- 429s in the logs are the signal to lower it).
      # The code cap matches, so configuration can only lower it.
      CHANGELOG_LLM_RPM: ${{ vars.CHANGELOG_LLM_RPM || '60' }}
      CHANGELOG_LLM_RPM_WARMUP: '1'
      # A bad-content row must not disappear forever. Re-probe at most daily,
      # retaining attempts and all per-cycle/per-row spending bounds.
      CHANGELOG_LLM_PARK_RETRY_MS: '86400000'
      CHANGELOG_GENERATION_STALE_MIN: '30'
      # Failover route for every paid stage (writer, verifier, plain-English).
      # Tried after the primary route fails at the transport/gateway level or
      # answers deterministically from memory / refuses; auth errors stay on
      # the primary so they surface there.
      LLM_BACKUP_API_BASE: ${{ secrets.LLM_BACKUP_API_BASE }}
      LLM_BACKUP_API_KEY: ${{ secrets.LLM_BACKUP_API_KEY }}
      LLM_BACKUP_MODEL: ${{ secrets.LLM_BACKUP_MODEL }}
    steps:
      # Rolling cache key for the git directory below: a calendar week. The
      # key must roll (caches are immutable, so a static key could never be
      # refreshed) but not per run (the old freebuff cache keyed on
      # github.run_id and burned the quota on a fresh copy every cycle).
      - name: Compute the rolling git-cache key
        id: gitcache
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # The relay only needs old SHAs for `git merge-base --is-ancestor` when
      # it picks the last known-good generator, but fetch-depth: 0 re-cloned
      # the whole history every ~12-minute cycle. Restore the previous run's
      # git directory instead: checkout reuses an existing .git (it fetches
      # rather than cloning when the directory already holds a repository --
      # verified against actions/checkout's git-source-provider), so on a
      # warm cache the "full" fetch below is only the delta since the last
      # cycle. A stale or missing cache just means a longer fetch -- up to
      # one full clone -- never wrong results: checkout always fetches the
      # tip, and merge-base only runs on objects that are really there.
      - name: Restore the git directory from the previous run
        id: gitrestore
        uses: actions/cache/restore@v4
        with:
          path: .git
          key: sync-git-${{ runner.os }}-v1-${{ steps.gitcache.outputs.week }}
          restore-keys: |
            sync-git-${{ runner.os }}-

      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 stays: on a warm cache this is a delta fetch, not
          # a clone. The generator-promotion step below needs real history
          # for `git merge-base --is-ancestor` against candidate SHAs, which
          # a shallow checkout cannot answer.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select last known-good generator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          good=''
          candidates="$(gh run list --workflow generator-check.yml --branch "$GITHUB_REF_NAME" --event push --status success --limit 50 --json headSha --jq '.[].headSha')"
          for candidate in $candidates; do
            # Old successful code can still lack the non-negotiable spending
            # policy or workspace-root support. It is not an eligible fallback.
            if git merge-base --is-ancestor "$candidate" HEAD &&
               git show "$candidate:generator/lib/quality.mjs" 2>/dev/null | grep -q 'QUALITY_POLICY_V = 1' &&
               git show "$candidate:generator/cli.mjs" 2>/dev/null | grep -q 'CHANGELOG_WORKSPACE_ROOT'; then
              good="$candidate"
              break
            fi
          done
          if [ -z "$good" ]; then
            echo "::error::No promoted generator exists. Run generator-check successfully before starting ingestion."
            exit 1
          fi
          git cat-file -e "${good}^{commit}"
          mkdir -p .cache/promoted-runtime
          git archive "$good" generator | tar -x -C .cache/promoted-runtime
          echo "Promoted generator: $good (data stays on current branch)"
          for f in .cache/promoted-runtime/generator/cli.mjs .cache/promoted-runtime/generator/lib/*.mjs; do node --check "$f"; done

      - name: Cache freebuff repository
        uses: actions/cache@v4
        with:
          path: .cache/freebuff
          # A static key, deliberately: the old key ended in github.run_id, so
          # every ~12-minute relay cycle missed on read and saved a brand-new
          # clone -- burning the 10 GB cache quota on hundreds of near-identical
          # copies a week. Caches are immutable: restore the shared baseline
          # and fetch upstream on every cycle; hits do not update that baseline.
          #
          # restore-keys is what makes renaming the primary key safe. Without
          # it, the rename was a guaranteed miss on the first run: a pristine
          # workspace with no `.cache/` at all, which used to take the whole
          # cycle down with it (the lock dir could not be created inside a
          # missing parent). A miss is now only expensive -- a fresh clone --
          # never fatal.
          key: freebuff-git-${{ runner.os }}-v1
          restore-keys: |
            freebuff-git-

      - name: Configure git bot identity
        run: |
          git config --global user.name "changelog-bot"
          git config --global user.email "changelog-bot@users.noreply.github.com"

      # deploy.yml is supposed to run on every push to data/**. GitHub refuses to
      # start a workflow run for a push made with the repository's default
      # GITHUB_TOKEN -- the token actions/checkout persists as an http extraheader
      # and the sync job has been pushing with -- so deploy.yml's push trigger was
      # dead and the site refreshed only on its own 30-minute schedule. That is
      # why it read "[stale 16m]" while data commits kept landing every few minutes.
      # Authenticate the pushes with CHANGELOG_GITHUB_TOKEN instead, but only
      # after proving that token may write, so a token without Contents: write
      # falls back to the checkout credentials instead of breaking the sync.
      # The token needs Actions: read+write as well: `gh run list` gates the
      # queued-run checks here and in cli.mjs' --exit-on-queued, and this token
      # dispatches the next relay cycle. A Contents-only PAT passes the probe
      # below and still downgrades the relay to watchdog cadence.
      - name: Authenticate data pushes so they trigger deploy.yml
        id: push_auth
        env:
          PUSH_TOKEN: ${{ secrets.CHANGELOG_GITHUB_TOKEN }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::warning::CHANGELOG_GITHUB_TOKEN is not set: data pushes keep using the default GITHUB_TOKEN, which cannot trigger deploy.yml. The site will refresh only on deploy.yml's schedule."
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          can_push="$(GH_TOKEN="$PUSH_TOKEN" gh api "repos/${GITHUB_REPOSITORY}" --jq '.permissions.push' 2>/dev/null || echo false)"
          if [ "$can_push" != "true" ]; then
            echo "::warning::CHANGELOG_GITHUB_TOKEN cannot push to ${GITHUB_REPOSITORY}: keeping the checkout credentials. The site will refresh only on deploy.yml's schedule."
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # checkout stores the default token under this exact key, and its
          # Authorization header takes precedence over credentials in the remote
          # URL, so replace it rather than setting URL credentials.
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          echo "Data pushes now authenticate with CHANGELOG_GITHUB_TOKEN: each data commit starts a deploy."
          echo "fallback=false" >> "$GITHUB_OUTPUT"

      # Deliberate release of a named row (or a few): an admitted row the
      # pipeline will never re-ask on its own -- a failure stub parked before
      # the classification was fixed, or a refusal recorded while the
      # strong-model hatch was dead in CI. This is the one path that regenerates
      # by name, so it is a dispatch input a human types, not something the
      # schedule decides; the CLI's own guards (admitted, no generation, not
      # noise, <=5 rows) are what keep it from becoming a backfill tool.
      # Runs before the sync loop, under the same promoted runtime and key.
      - name: Release named rows for regeneration
        id: retry
        if: github.event_name == 'workflow_dispatch' && inputs.retry != ''
        env:
          CHANGELOG_WORKSPACE_ROOT: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.CHANGELOG_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.CHANGELOG_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          CHANGELOG_LLM: ${{ vars.CHANGELOG_LLM || '1' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_KEYS: ${{ secrets.LLM_API_KEYS || vars.LLM_API_KEYS }}
          # Provider identity comes from secrets/vars (Agnes AI write model,
          # Google free-tier backup). The literal is only the floor, so an
          # unset secret cannot silently route a paid stage to a placeholder.
          LLM_API_BASE: ${{ secrets.LLM_API_BASE || vars.LLM_API_BASE || 'https://apihub.agnes-ai.com/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || vars.LLM_MODEL || 'agnes-3.0-flash' }}
          LLM_MODEL_MAJOR: ${{ secrets.LLM_MODEL_MAJOR || vars.LLM_MODEL_MAJOR }}
          LLM_VERIFY_MODEL: ${{ secrets.LLM_VERIFY_MODEL || vars.LLM_VERIFY_MODEL || 'agnes-3.0-flash' }}
          # Same decision as the watch step: the verifier is off, and a named
          # release must not re-run it (a 200-body timeout frame burned
          # two-thirds of a row's budget and flagged rows it never read).
          CHANGELOG_LLM_VERIFY: ${{ vars.CHANGELOG_LLM_VERIFY || '0' }}
          CHANGELOG_LLM_NO_BACKFILL: '1'
          RETRY_INPUT: ${{ inputs.retry }}
          ADMIT_INPUT: ${{ inputs.admit }}
        # Sanitized to word separators before the split: only the CLI's own
        # sha-prefix parsing decides what these tokens mean.
        run: |
          shas=$(printf '%s' "$RETRY_INPUT" | tr ',' ' ' | tr -cd 'A-Za-z0-9 \n')
          flag=""
          if [ "$ADMIT_INPUT" = "true" ]; then flag="--admit"; fi
          echo "Releasing: $shas${flag:+ ($flag)}"
          node .cache/promoted-runtime/generator/cli.mjs retry-failed $shas $flag --push

      # Refresh the newest entries on request: re-asks rows that already have
      # text (bounded at 50, newest first, rows outside the set untouched, and a
      # failed ask leaves the shipped text in place). Its own per-row budget,
      # deliberately separate from the relay cycle that follows it. The input is
      # a count or a comma-separated list of SHA prefixes -- named stragglers
      # from an earlier run -- and the CLI enforces the same bounds either way.
      - name: Regenerate the newest entries
        id: regen
        if: github.event_name == 'workflow_dispatch' && inputs.regen != ''
        env:
          CHANGELOG_WORKSPACE_ROOT: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.CHANGELOG_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.CHANGELOG_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          CHANGELOG_LLM: ${{ vars.CHANGELOG_LLM || '1' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_KEYS: ${{ secrets.LLM_API_KEYS || vars.LLM_API_KEYS }}
          # Provider identity comes from secrets/vars (Agnes AI write model,
          # Google free-tier backup); the literal is only the floor.
          LLM_API_BASE: ${{ secrets.LLM_API_BASE || vars.LLM_API_BASE || 'https://apihub.agnes-ai.com/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || vars.LLM_MODEL || 'agnes-3.0-flash' }}
          LLM_MODEL_MAJOR: ${{ secrets.LLM_MODEL_MAJOR || vars.LLM_MODEL_MAJOR }}
          LLM_VERIFY_MODEL: ${{ secrets.LLM_VERIFY_MODEL || vars.LLM_VERIFY_MODEL || 'agnes-3.0-flash' }}
          # Same decision as the watch step: the verifier is off, so a named
          # catch-up asks only for text. Without this, every fresh row ended
          # review-pending by policy and the run called its own success a
          # bounded-repair failure.
          CHANGELOG_LLM_VERIFY: ${{ vars.CHANGELOG_LLM_VERIFY || '0' }}
          CHANGELOG_LLM_NO_BACKFILL: '1'
          REGEN_INPUT: ${{ inputs.regen }}
        # Validate before cleaning, so junk is rejected loudly instead of
        # being silently mangled into a plausible-looking SHA: only hex digits,
        # commas and whitespace may appear (whitespace is dropped, so "sha,
        # sha" works too). A single all-digit token is a count; anything else
        # is a comma-separated SHA list, which is what makes a follow-up run at
        # specific stragglers possible. The CLI enforces the same bounds after.
        run: |
          if ! printf '%s' "$REGEN_INPUT" | grep -Eq '^[0-9a-fA-F,[:space:]]*$'; then
            echo "::error::regen input must be a count or comma-separated SHA prefixes: got '$REGEN_INPUT'"
            exit 1
          fi
          clean=$(printf '%s' "$REGEN_INPUT" | tr -cd '0-9a-fA-F,')
          if printf '%s' "$clean" | grep -Eq '^[0-9]+$'; then
            echo "Regenerating the newest $clean entries"
            set -- "$clean"
          elif printf '%s' "$clean" | grep -Eq '^[0-9a-fA-F]+(,[0-9a-fA-F]+)*$'; then
            echo "Regenerating named rows: $clean"
            IFS=',' read -r -a rows <<< "$clean"
            set -- "${rows[@]}"
          else
            echo "::error::regen input must be a count or comma-separated SHA prefixes: got '$REGEN_INPUT'"
            exit 1
          fi
          node .cache/promoted-runtime/generator/cli.mjs regen-last "$@" --push

      - name: Run continuous sync and forward enrichment
        id: sync_loop
        # Even a failed named repair must not suppress deterministic ingestion.
        if: always() && !cancelled()
        env:
          CHANGELOG_WORKSPACE_ROOT: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.CHANGELOG_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.CHANGELOG_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL || 'https://freebuff-changelog.nordicnode.workers.dev' }}
          CHANGELOG_LLM: ${{ vars.CHANGELOG_LLM || '1' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_KEYS: ${{ secrets.LLM_API_KEYS || vars.LLM_API_KEYS }}
          # Provider identity comes from secrets/vars (Agnes AI write model,
          # Google free-tier backup); the literal is only the floor.
          LLM_API_BASE: ${{ secrets.LLM_API_BASE || vars.LLM_API_BASE || 'https://apihub.agnes-ai.com/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || vars.LLM_MODEL || 'agnes-3.0-flash' }}
          # The escalation escape hatch: without it strongModelEnv() returns
          # null, a row whose every rung failed throws and parks instead of
          # getting the one stronger-model rewrite the pipeline is built to
          # give it (eval-weekly already passed it; the two production
          # pipelines never did, so the hatch was dead in CI).
          LLM_MODEL_MAJOR: ${{ secrets.LLM_MODEL_MAJOR || vars.LLM_MODEL_MAJOR }}
          LLM_VERIFY_MODEL: ${{ secrets.LLM_VERIFY_MODEL || vars.LLM_VERIFY_MODEL || 'agnes-3.0-flash' }}
          # Backup route for LLM failures (optional)
          LLM_BACKUP_API_BASE: ${{ secrets.LLM_BACKUP_API_BASE }}
          LLM_BACKUP_API_KEY: ${{ secrets.LLM_BACKUP_API_KEY }}
          LLM_BACKUP_MODEL: ${{ secrets.LLM_BACKUP_MODEL }}
          CHANGELOG_LLM_LIMIT: ${{ vars.CHANGELOG_LLM_LIMIT || '10' }}
          CHANGELOG_LLM_CONCURRENCY: ${{ vars.CHANGELOG_LLM_CONCURRENCY || '3' }}
          LLM_TIMEOUT_MS: ${{ secrets.LLM_TIMEOUT_MS || vars.LLM_TIMEOUT_MS || '300000' }}
          # How much wall clock one cycle may spend on model calls, and how much
          # of that a single row owns. The per-call timeout above is an upper
          # bound on one attempt, not a plan: a 300s call on a 240s cycle clock
          # was unanswerable by construction, which is how ten relay cycles in a
          # row wrote nothing. Both are further bounded by the watch run's own
          # remaining time, and a window too short for even one row is skipped
          # and said so, instead of being started on guaranteed-dead calls.
          CHANGELOG_LLM_CYCLE_BUDGET_MS: ${{ vars.CHANGELOG_LLM_CYCLE_BUDGET_MS || '300000' }}
          CHANGELOG_LLM_ROW_BUDGET_MS: ${{ vars.CHANGELOG_LLM_ROW_BUDGET_MS || '90000' }}
          CHANGELOG_ELI5_ROW_BUDGET_MS: ${{ vars.CHANGELOG_ELI5_ROW_BUDGET_MS || '45000' }}
          # The semantic verifier is off, deliberately (operator decision,
          # 2026-10-02). It was the most expensive and least reliable stage in
          # the forward pass: measured on the project's provider one verify ask
          # took ~23s, two of three came back as a gateway timeout frame, and a
          # row whose check could not run shipped as "Automated review is
          # pending" while it had already spent two-thirds of its row budget on
          # the check. Its slots are better spent writing the rows that have no
          # text at all. Consequence, named: new rows carry NO verdict -- they
          # are not marked verified and cannot claim to be (the site and the API
          # say so); rows that already carry a verdict keep it.
          CHANGELOG_LLM_VERIFY: ${{ vars.CHANGELOG_LLM_VERIFY || '0' }}
          CHANGELOG_LLM_NO_BACKFILL: '1'
          CHANGELOG_LLM_MAX_CALLS_PER_ENTRY: '12'
          CHANGELOG_SYNC_STALE_MIN: '5'
          CHANGELOG_PR_REFRESH_MIN: '2'
          WATCH_INTERVAL: '30'
          WATCH_DURATION: '12m'
          WATCH_EXIT_ON_QUEUED: '1'
        run: node .cache/promoted-runtime/generator/cli.mjs watch --push --interval 30 --duration 12m --exit-on-queued

      # `if: always()`, on purpose. A failed sync used to stop the chain here:
      # the step is gated on the loop's success, so the relay died on the very
      # run that had just proven it could not publish anything, and the site
      # dropped to the watchdog's 10-minute cadence with no data commit at all
      # for the whole outage. Retrying is what keeps the site fresh, so the next
      # cycle is dispatched whether or not this one worked -- the loop now
      # aborts early when its freshness budget is blown, so the retry lands in
      # minutes instead of after a full dead 12-minute run.
      - name: Dispatch next relay cycle
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CHANGELOG_GITHUB_TOKEN }}
          SYNC_OUTCOME: ${{ steps.sync_loop.outcome }}
        run: |
          if [ "$SYNC_OUTCOME" != "success" ] && [ "$SYNC_OUTCOME" != "skipped" ]; then
            echo "::error::sync loop outcome: $SYNC_OUTCOME - no fresh data was published this cycle; the site keeps its previous deploy. Dispatching the next relay cycle anyway."
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "CHANGELOG_GITHUB_TOKEN not configured; relying on watchdog schedule."
            exit 0
          fi
          # Only runs created in the last 15 minutes count: a stale queued entry
          # (or a transient API ghost) must not break the relay chain by
          # suppressing the dispatch behind it. String comparison works because
          # both sides are UTC ISO-8601 with the same prefix shape.
          QUEUED_CUTOFF=$(date -u -d '15 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          # gh's --jq accepts an expression, not jq's separate --arg flag.
          # Fail an API error visibly rather than treating it as an empty queue.
          QUEUED_COUNT=$(gh run list --workflow changelog-sync.yml --json databaseId,status,createdAt --jq "[.[] | select((.status == \"requested\" or .status == \"queued\" or .status == \"pending\" or .status == \"waiting\") and .createdAt > \"$QUEUED_CUTOFF\")] | length")
          if [ "$QUEUED_COUNT" -eq 0 ]; then
            echo "Dispatching next relay run to maintain 24/7 continuous synchronization..."
            # A failed dispatch breaks the chain until the watchdog's next
            # tick, and a PAT missing Actions scope fails it the same way on
            # every single run -- silently, if it stays a warning. The auth
            # step catches an absent token; this catches a scoped-wrong one:
            # red, within one cycle, the relay cannot degrade quietly.
            #
            # Transient GitHub API failures (HTTP 5xx, network errors) get a
            # bounded retry with backoff instead of snapping the chain on the
            # first blip: on 2026-10-07 a single HTTP 500 on the dispatch call
            # broke the relay until a manual restart. Auth/scope failures
            # (401/403/404) still fail fast and red -- retrying those never
            # helps.
            DISPATCH_OK=0
            DISPATCH_ERR=""
            for ATTEMPT in 1 2 3; do
              if DISPATCH_OUT=$(gh workflow run changelog-sync.yml 2>&1); then
                echo "$DISPATCH_OUT"
                DISPATCH_OK=1
                break
              fi
              DISPATCH_ERR="$DISPATCH_OUT"
              case "$DISPATCH_ERR" in
                *"HTTP 401"*|*"HTTP 403"*|*"HTTP 404"*)
                  break
                  ;;
              esac
              if [ "$ATTEMPT" -lt 3 ]; then
                # 30s then 90s: short enough to keep the chain tight, long
                # enough to ride out a transient API wobble.
                SLEEP_S=30
                [ "$ATTEMPT" -eq 2 ] && SLEEP_S=90
                echo "Dispatch attempt $ATTEMPT failed (transient); retrying in ${SLEEP_S}s..." >&2
                echo "$DISPATCH_ERR" >&2
                sleep "$SLEEP_S"
              fi
            done
            if [ "$DISPATCH_OK" -ne 1 ]; then
              echo "$DISPATCH_ERR" >&2
              echo "::error::relay dispatch failed after 3 attempts: the chain drops to watchdog cadence (<=10 min) until it recovers."
              exit 1
            fi
          else
            echo "A workflow run is already queued ($QUEUED_COUNT pending). Skipping duplicate dispatch."
          fi

      # Independent of ingestion freshness and optional review. Run after the
      # handoff so an overdue generation goes red without breaking the relay.
      - name: Generation completeness gate
        if: always() && !cancelled()
        env:
          CHANGELOG_WORKSPACE_ROOT: ${{ github.workspace }}
        run: node .cache/promoted-runtime/generator/cli.mjs generation-health

      # The end-of-run bill, placed after the dispatch so the chain is handed
      # off before this job turns red. A push-auth fallback means data commits
      # land with the default GITHUB_TOKEN: deploy.yml's push trigger is dead,
      # the sync loop still runs green (generatedAt advances,
      # the freshness gate measures data age at build time), and the site
      # quietly drops to deploy.yml's 30-minute schedule. The one failure
      # signal the old design emitted was a workflow warning nobody watches:
      # PAT expiry has to be red, not yellow.
      - name: Fail on silent push-auth degradation
        if: always() && steps.push_auth.outputs.fallback == 'true' && steps.sync_loop.outcome != 'cancelled'
        run: |
          echo "::error::CHANGELOG_GITHUB_TOKEN is missing or cannot push: data commits no longer trigger deploy.yml. Restore the token (Contents: write + Actions: read/write) -- until then the site refreshes only on deploy.yml's 30-minute schedule."
          exit 1

      # Save the fetched history for the next cycle. Skipped when this run
      # restored an exact hit -- the cache already holds this week's baseline
      # and caches are immutable, so re-saving would just burn quota. A red
      # run still saves: a fetch only ever adds objects, so a failed sync
      # leaves a valid baseline behind. Cancelled runs skip it: a killed
      # fetch can leave a half-written pack.
      - name: Save the git directory for the next run
        if: always() && !cancelled() && steps.gitrestore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git
          key: sync-git-${{ runner.os }}-v1-${{ steps.gitcache.outputs.week }}

