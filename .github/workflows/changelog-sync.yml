name: changelog-sync
# Hourly: analyze new freebuff commits, regenerate data + site, push data back.
# Cloudflare Workers (git-integrated) rebuilds automatically on that push.
# The build is a no-op when nothing changed: Workers skips deploys without pushes.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main, master]
    paths: ['generator/**']

permissions:
  contents: write

concurrency:
  group: changelog-sync
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check + tests
        run: |
          for f in generator/cli.mjs generator/lib/*.mjs; do node --check "$f"; done
          node --test generator/test

      - name: Cache freebuff repository
        uses: actions/cache@v4
        with:
          path: .cache/freebuff
          key: freebuff-git-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            freebuff-git-${{ runner.os }}-

      - name: Analyze upstream freebuff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL || 'https://freebuff-changelog.nordicnode.workers.dev' }}
          # Optional AI rewrite layer (safe to leave unset: deterministic summaries are used):
          CHANGELOG_LLM: ${{ vars.CHANGELOG_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ vars.LLM_API_BASE }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          CHANGELOG_LLM_LIMIT: ${{ vars.CHANGELOG_LLM_LIMIT || '10' }}
          CHANGELOG_LLM_CONCURRENCY: ${{ vars.CHANGELOG_LLM_CONCURRENCY || '5' }}
        run: node generator/cli.mjs generate

      - name: Commit & push data (only if changed)
        run: |
          git config user.name "changelog-bot"
          git config user.email "changelog-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data
            git commit -m "data: update changelog ($(date -u '+%Y-%m-%d %H:%M') UTC)"
            git push
          else
            echo "no new commits upstream: nothing to push"
          fi
