name: generator-check

on:
  pull_request:
    paths: ['generator/**', 'worker.js', 'package.json', '.github/workflows/**']
  push:
    branches: [main, master]
    paths: ['generator/**', 'worker.js', 'package.json', '.github/workflows/**']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHANGELOG_LLM: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tracked file size budget
        # GitHub rejects any push carrying a file over 100 MiB, and a rejected
        # push is the whole relay cycle. Same gate the relay runs before it
        # commits (assertDataSizeBudget), surfaced here first.
        run: node generator/cli.mjs check-size

      - name: Syntax and offline regressions
        run: |
          for f in worker.js generator/cli.mjs generator/lib/*.mjs generator/test/*.mjs scripts/*.mjs; do node --check "$f"; done
          npm test
          npm run build

      - name: Deploy envelope (dist/ against the Workers static-asset cap)
        # Cloudflare accepts 20,000 static asset files per Worker version, and
        # past that every upload fails while ingestion, generation and freshness
        # all stay green. Retention (generator/lib/retention.mjs) is what keeps
        # the count inside the budget by construction; this is the gate that
        # notices if the budget, the plan's estimate of the fixed asset families,
        # or a newly added family ever stops agreeing with each other.
        run: node generator/cli.mjs check-dist
