name: Data correction
description: A summary or plain-English explanation says something wrong
title: "[correction]: "
labels: ["data"]
body:
  - type: input
    id: entry
    attributes:
      label: Entry permalink
      description: The /c/<sha> link to the entry with the wrong text
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What does it say that's wrong?
      description: Quote the text and name the error
    validations:
      required: true
  - type: textarea
    id: right
    attributes:
      label: What should it say?
      description: The corrected wording, if you have it
