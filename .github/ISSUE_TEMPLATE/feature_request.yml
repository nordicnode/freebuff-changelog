name: Feature request
description: An idea for the site or the generator
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: The change, in a sentence or two
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: Who benefits and what gets easier
