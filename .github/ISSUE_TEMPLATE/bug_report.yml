name: Bug report
description: Something on the site or in the data is wrong
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link
      description: The /c/<sha> permalink or page URL, if this concerns an entry
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: What to click or run to see it again
  - type: input
    id: env
    attributes:
      label: Browser / environment
      description: e.g. Firefox 141 on Linux, or Node 22 locally
